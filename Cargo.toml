[package]
name = "persona"
version = "0.1.0"
edition = "2021"
authors = ["GPTmadeit"]
license = "GPL-3.0-or-later"
description = "Rap vocal chains in the style of your favorite artists (VST3 + CLAP)"
repository = "https://github.com/GPTmadeit/persona"

[workspace]
members = ["xtask", "tools/render"]

[lib]
crate-type = ["cdylib", "lib"]

# A standalone window for developing the UI without a DAW: `cargo run --features standalone -- --backend dummy`
[[bin]]
name = "persona-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
standalone = ["nih_plug/standalone"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
semver = "1"
sha2 = "0.10"
process_path = "0.1"
parking_lot = "0.12"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
